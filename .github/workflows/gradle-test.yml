name: Build Jar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test and build jar
        run: gradle clean test jar --no-daemon --console=plain

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Byblack-ARSCLib-JAR
          path: build/libs/*.jar
          if-no-files-found: error
